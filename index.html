<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주간 근무시간 계산기 (v14 - 예측로직 수정완료)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .time-input {
            width: 100%; min-width: 160px; padding: 6px 10px;
            border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px;
        }
        .time-input:focus { border-color: #4f46e5; outline: none; box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2); }
        .leave-hours-input {
            width: 60px; padding: 6px 8px;
            border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; text-align: center;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="p-6 md:p-8">
            <h1 class="text-3xl font-bold text-indigo-700 mb-2">주간 근무시간 계산기</h1>
            <p class="text-slate-600">식사 포함/제외 기준에 맞춰 <span class="text-indigo-600 font-bold">퇴근 시각을 정확히 분리</span>하여 예측합니다.</p>

            <div class="mt-6 mb-8 p-6 bg-indigo-50 rounded-lg border border-indigo-100">
                <label for="csvUploader" class="block text-sm font-bold text-indigo-800 mb-2">📂 근태 CSV 파일 선택</label>
                <input type="file" id="csvUploader" accept=".csv" class="block w-full text-sm text-slate-500
                    file:mr-4 file:py-2.5 file:px-4
                    file:rounded-md file:border-0
                    file:text-sm file:font-semibold
                    file:bg-white file:text-indigo-700
                    file:shadow-sm
                    hover:file:bg-indigo-50 cursor-pointer
                ">
            </div>

            <div id="loading-spinner" class="hidden text-center py-8">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
                <p class="mt-2 text-indigo-600 font-medium">공휴일 정보를 불러오는 중...</p>
            </div>

            <div id="results-container" class="space-y-8">
                <div id="placeholder" class="text-center text-slate-400 py-16 border-2 border-dashed border-slate-300 rounded-lg">
                    <p class="text-lg">파일을 업로드하면 결과가 표시됩니다.</p>
                </div>
            </div>

            <div id="summary-container" class="mt-8 grid grid-cols-1 gap-6"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const API_KEY = "b060c24914cc86079258cce70c2f5ed20157eea835b61224c687501034d7a6b6";
            let HOLIDAYS = new Set();
            let FETCHED_MONTHS = new Set();
            let allCsvData = {}; 
            let liveUpdateInterval = null;
            let remainingDaysAdjustments = {};

            const csvUploader = document.getElementById('csvUploader');
            const resultsContainer = document.getElementById('results-container');
            const summaryContainer = document.getElementById('summary-container');
            const placeholder = document.getElementById('placeholder');
            const spinner = document.getElementById('loading-spinner');

            csvUploader.addEventListener('change', handleFileUpload);

            async function handleFileUpload(event) {
                if (liveUpdateInterval) clearInterval(liveUpdateInterval);
                const file = event.target.files[0];
                if (!file) return;

                placeholder.style.display = 'none';
                resultsContainer.innerHTML = '';
                summaryContainer.innerHTML = '';
                spinner.classList.remove('hidden');
                remainingDaysAdjustments = {};
                
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const data = parseCSV(e.target.result);
                        if (!data.length) throw new Error("데이터가 없습니다.");
                        
                        await prepareHolidaysForData(data);
                        processCsvData(data);
                        spinner.classList.add('hidden');
                    } catch (err) {
                        spinner.classList.add('hidden');
                        alert("오류: " + err.message);
                        placeholder.style.display = 'block';
                    }
                };
                reader.readAsText(file, "UTF-8"); 
            }

            // --- API 연동 ---
            async function prepareHolidaysForData(data) {
                const monthsToFetch = new Set();
                const now = new Date();
                monthsToFetch.add(`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}`);
                
                data.forEach(row => {
                    if (row.근무일자) {
                        const parts = row.근무일자.split('-'); 
                        if (parts.length >= 2) monthsToFetch.add(`${parts[0]}${parts[1]}`);
                    }
                });

                const promises = [];
                for (const ym of monthsToFetch) {
                    if (!FETCHED_MONTHS.has(ym)) {
                        promises.push(fetchHolidaysFromApi(ym.substring(0,4), ym.substring(4,6)));
                        FETCHED_MONTHS.add(ym);
                    }
                }
                if (promises.length) await Promise.all(promises);
            }

            async function fetchHolidaysFromApi(year, month) {
                const url = `https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo?solYear=${year}&solMonth=${month}&ServiceKey=${API_KEY}&_type=json&numOfRows=50`;
                try {
                    const res = await fetch(url);
                    const json = await res.json();
                    const items = json.response?.body?.items?.item;
                    if (items) {
                        (Array.isArray(items) ? items : [items]).forEach(item => {
                            if (item.isHoliday === 'Y') {
                                const s = String(item.locdate);
                                HOLIDAYS.add(`${s.substring(0,4)}-${s.substring(4,6)}-${s.substring(6,8)}`);
                            }
                        });
                    }
                } catch (e) { console.error(e); }
            }

            function processCsvData(data) {
                allCsvData = {};
                data.forEach(row => {
                    if (!row.이름) return;
                    if (!allCsvData[row.이름]) allCsvData[row.이름] = [];
                    allCsvData[row.이름].push(row);
                });
                renderDataTables();
                calculateAllTotals();
            }

            function renderDataTables() {
                resultsContainer.innerHTML = '';
                Object.keys(allCsvData).sort().forEach(name => {
                    const rows = allCsvData[name];
                    rows.sort((a, b) => (a.근무일자 || '') > (b.근무일자 || '') ? 1 : -1);

                    const div = document.createElement('div');
                    div.className = 'bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden';
                    
                    let trs = rows.map((row, idx) => `
                        <tr class="hover:bg-slate-50 transition-colors" data-name="${name}">
                            <td class="p-3 border-b text-sm text-slate-600">${row.근무일자 || '-'}</td>
                            <td class="p-3 border-b"><input type="text" class="time-input clock-in" value="${row.출근시간 || ''}" placeholder="YYYY-MM-DD HH:MM:SS"></td>
                            <td class="p-3 border-b"><input type="text" class="time-input clock-out" value="${row.퇴근시간 || ''}" placeholder="YYYY-MM-DD HH:MM:SS"></td>
                            <td class="p-3 border-b"><input type="text" class="leave-hours-input leave-hours" value="${row.외출시간 || ''}" placeholder="H:MM"></td>
                            <td class="p-3 border-b">
                                <select class="leave-selector text-sm border-gray-300 rounded p-1">
                                    <option value="normal">정상 근무</option>
                                    <option value="annual">연차 (8h)</option>
                                    <option value="half">반차 (4h)</option>
                                    <option value="quarter">반반차 (2h)</option>
                                </select>
                            </td>
                        </tr>
                    `).join('');

                    div.innerHTML = `
                        <div class="bg-slate-50 p-4 border-b border-slate-200"><h2 class="text-lg font-bold text-slate-800">👤 ${name}</h2></div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-slate-100 text-slate-500 text-xs uppercase">
                                    <tr><th class="p-3">날짜</th><th class="p-3">출근</th><th class="p-3">퇴근</th><th class="p-3">외출</th><th class="p-3">비고</th></tr>
                                </thead>
                                <tbody class="bg-white">${trs}</tbody>
                            </table>
                        </div>
                    `;
                    resultsContainer.appendChild(div);
                });
                resultsContainer.querySelectorAll('input, select').forEach(el => el.addEventListener('change', calculateAllTotals));
            }

            // --- 계산 로직 ---
            function calculateAllTotals() {
                const isInit = (summaryContainer.innerHTML.trim() === '');
                const totals = {};
                let liveNeeded = false;

                document.querySelectorAll('tr[data-name]').forEach(tr => {
                    const name = tr.dataset.name;
                    if (!totals[name]) {
                        totals[name] = { 
                            h40: 0, h45: 0, 
                            dates: new Set(), 
                            lastClockIn: null, 
                            hasOutTime: false, 
                            workingToday: false
                        };
                    }

                    const dateStr = tr.children[0].innerText.trim();
                    const dateMatch = dateStr.match(/\d{4}-\d{2}-\d{2}/);
                    const validDateStr = dateMatch ? dateMatch[0] : null;

                    if (validDateStr) totals[name].dates.add(validDateStr);

                    const inVal = tr.querySelector('.clock-in').value.trim();
                    const outVal = tr.querySelector('.clock-out').value.trim();
                    const leaveH = timeToHours(tr.querySelector('.leave-hours').value);
                    const type = tr.querySelector('.leave-selector').value;

                    const inDate = parseSmartTime(inVal, validDateStr);
                    let outDate = parseSmartTime(outVal, validDateStr);

                    if (inDate) {
                        totals[name].lastClockIn = inDate;
                        totals[name].hasOutTime = !!outDate;
                    }

                    let dH40 = 0, dH45 = 0;
                    if (inDate) {
                        if (outDate) {
                            if (outDate < inDate) outDate.setDate(outDate.getDate() + 1); 
                            const res = calcDuration(inDate, outDate);
                            dH40 = res.h40; dH45 = res.h45;
                        } else {
                            const res = calcLiveDuration(inDate);
                            dH40 = res.h40; dH45 = res.h45;
                            totals[name].workingToday = true;
                            liveNeeded = true;
                        }
                    }

                    if (isNaN(dH40)) dH40 = 0;
                    if (isNaN(dH45)) dH45 = 0;
                    
                    dH40 = Math.max(0, dH40 - leaveH);
                    dH45 = Math.max(0, dH45 - leaveH);

                    if (type === 'annual') { dH40 += 8; dH45 += 9; }
                    else if (type === 'half') { dH40 += 4; dH45 += 5; }
                    else if (type === 'quarter') { dH40 += 2; dH45 += 3; }

                    totals[name].h40 += dH40;
                    totals[name].h45 += dH45;
                });

                Object.keys(totals).forEach(name => {
                    const t = totals[name];
                    const autoDays = calcRemainingDays(t.dates); 
                    const adj = remainingDaysAdjustments[name] || 0;
                    t.remDays = Math.max(0, autoDays + adj);

                    t.predict40 = null;
                    t.predict45 = null;

                    if (t.workingToday && t.lastClockIn && !t.hasOutTime) {
                        const gap40 = 40 - t.h40 - (t.remDays * 8);
                        const gap45 = 45 - t.h45 - (t.remDays * 9);
                        
                        // ★★★ v14 수정: 40시간과 45시간의 계산 방식을 분리 ★★★
                        // 40시간 (식사제외) -> 점심시간이 끼면 1시간 더 늦게 퇴근해야 함 (기존 calcExitTime)
                        t.predict40 = calcExitTimeWithLunch(new Date(), gap40, t.lastClockIn);
                        
                        // 45시간 (식사포함) -> 점심시간도 근무(체류)에 포함되므로, 그냥 단순 시간 더하기
                        if (gap45 > 0) {
                            t.predict45 = new Date(new Date().getTime() + gap45 * 3600000);
                        } else {
                            t.predict45 = null; // 이미 달성
                        }
                    }
                });

                if (liveNeeded && !liveUpdateInterval) liveUpdateInterval = setInterval(calculateAllTotals, 10000);
                else if (!liveNeeded && liveUpdateInterval) { clearInterval(liveUpdateInterval); liveUpdateInterval = null; }

                if (isInit) createSummaryCards(totals);
                else updateSummaryCards(totals);
            }

            function createSummaryCards(totals) {
                summaryContainer.innerHTML = '';
                Object.keys(totals).sort().forEach(name => {
                    const safe = name.replace(/\s+/g, '-');
                    const div = document.createElement('div');
                    div.className = 'bg-white p-6 rounded-lg shadow-md border border-indigo-100';
                    div.innerHTML = `
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-2xl font-bold text-indigo-900">${name}</h3>
                            <div class="flex items-center space-x-2 bg-slate-100 px-3 py-1 rounded">
                                <span class="text-xs text-slate-500">남은 평일</span>
                                <button onclick="adjDays('${name}', -1)" class="w-5 h-5 bg-white rounded shadow text-xs hover:bg-slate-50">-</button>
                                <span id="rem-${safe}" class="font-bold text-indigo-700">0</span>
                                <button onclick="adjDays('${name}', 1)" class="w-5 h-5 bg-white rounded shadow text-xs hover:bg-slate-50">+</button>
                            </div>
                        </div>

                        <div id="predict-box-${safe}" class="mb-6 p-4 bg-indigo-50 border border-indigo-200 rounded-lg hidden">
                            <h4 class="text-sm font-bold text-indigo-800 mb-2 flex items-center">
                                ⏱️ 목표 달성 퇴근 시각
                            </h4>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-white p-3 rounded border border-indigo-100 text-center">
                                    <p class="text-xs text-slate-500 mb-1">40시간 (식사제외)</p>
                                    <p id="time-40-${safe}" class="text-xl font-bold text-indigo-600">-</p>
                                </div>
                                <div class="bg-white p-3 rounded border border-indigo-100 text-center">
                                    <p class="text-xs text-slate-500 mb-1">45시간 (식사포함)</p>
                                    <p id="time-45-${safe}" class="text-xl font-bold text-indigo-600">-</p>
                                </div>
                            </div>
                        </div>

                        <div class="mb-2">
                            <div class="flex justify-between text-xs mb-1">
                                <span class="font-bold text-slate-600">주 40시간 (점심제외)</span>
                                <span id="pct-40-${safe}" class="font-bold text-indigo-600">0%</span>
                            </div>
                            <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
                                <div id="bar-40-${safe}" class="bg-indigo-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                            </div>
                            <div class="flex justify-between mt-1">
                                <span id="val-40-${safe}" class="text-xs text-slate-500 font-mono">0h 0m</span>
                                <span id="gap-40-${safe}" class="text-xs text-slate-400">-</span>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="flex justify-between text-xs mb-1">
                                <span class="font-bold text-slate-600">주 52시간 (법정)</span>
                                <span id="pct-52-${safe}" class="font-bold text-slate-500">0%</span>
                            </div>
                            <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                                <div id="bar-52-${safe}" class="bg-slate-300 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                            </div>
                            <div class="flex justify-between mt-1">
                                <span id="val-52-${safe}" class="text-xs text-slate-500 font-mono">0h 0m</span>
                                <span id="status-52-${safe}" class="text-xs text-slate-400">안전</span>
                            </div>
                        </div>

                        <div id="comp-box-${safe}" class="p-4 bg-green-50 border border-green-200 rounded-lg hidden">
                            <h4 class="text-sm font-bold text-green-800 mb-2 flex items-center">
                                🎁 보상 휴가 (초과분 x 1.5배)
                            </h4>
                            <div class="text-xs text-green-700 mb-3 bg-white p-2 rounded border border-green-100">
                                초과 근무 <span id="overtime-val-${safe}" class="font-bold">0분</span> 
                                × 1.5 = <span id="comp-total-${safe}" class="font-bold text-lg text-green-600">0분</span> 보상
                            </div>
                            
                            <div class="grid grid-cols-4 gap-2 text-center">
                                <div class="bg-white p-2 rounded border border-green-100">
                                    <p class="text-[10px] text-slate-500">연차(8h)</p>
                                    <p id="comp-8h-${safe}" class="font-bold text-green-600">-</p>
                                </div>
                                <div class="bg-white p-2 rounded border border-green-100">
                                    <p class="text-[10px] text-slate-500">반차(4h)</p>
                                    <p id="comp-4h-${safe}" class="font-bold text-green-600">-</p>
                                </div>
                                <div class="bg-white p-2 rounded border border-green-100">
                                    <p class="text-[10px] text-slate-500">반반차(2h)</p>
                                    <p id="comp-2h-${safe}" class="font-bold text-green-600">-</p>
                                </div>
                                <div class="bg-white p-2 rounded border border-green-100">
                                    <p class="text-[10px] text-slate-500">단축근무</p>
                                    <p id="comp-rem-${safe}" class="font-bold text-green-600">-</p>
                                </div>
                            </div>
                        </div>
                    `;
                    summaryContainer.appendChild(div);
                });
                updateSummaryCards(totals);
            }

            function updateSummaryCards(totals) {
                Object.keys(totals).forEach(name => {
                    const t = totals[name];
                    const safe = name.replace(/\s+/g, '-');

                    document.getElementById(`rem-${safe}`).innerText = t.remDays;

                    updateBar(`bar-40-${safe}`, `pct-40-${safe}`, t.h40, 40);
                    document.getElementById(`val-40-${safe}`).innerText = fmtH(t.h40);
                    
                    const gap40 = t.h40 - 40;
                    const elGap40 = document.getElementById(`gap-40-${safe}`);
                    
                    if(gap40 > 0.001) { 
                        elGap40.innerText = `+${fmtH(gap40)} 초과`; 
                        elGap40.className = "text-xs text-green-600 font-bold";
                        
                        const compBox = document.getElementById(`comp-box-${safe}`);
                        compBox.classList.remove('hidden');

                        const overtimeMins = Math.floor(gap40 * 60); 
                        const totalCompMins = Math.floor(overtimeMins * 1.5);
                        
                        let temp = totalCompMins;
                        const c8 = Math.floor(temp / 480); temp %= 480;
                        const c4 = Math.floor(temp / 240); temp %= 240;
                        const c2 = Math.floor(temp / 120); temp %= 120;
                        const cRem = temp; 

                        document.getElementById(`overtime-val-${safe}`).innerText = fmtH(gap40);
                        document.getElementById(`comp-total-${safe}`).innerText = `${totalCompMins}분`;
                        
                        document.getElementById(`comp-8h-${safe}`).innerText = c8 > 0 ? `${c8}개` : '-';
                        document.getElementById(`comp-4h-${safe}`).innerText = c4 > 0 ? `${c4}개` : '-';
                        document.getElementById(`comp-2h-${safe}`).innerText = c2 > 0 ? `${c2}개` : '-';
                        
                        if (cRem > 0) {
                             const rh = Math.floor(cRem / 60);
                             const rm = Math.floor(cRem % 60);
                             let txt = "";
                             if(rh>0) txt+=`${rh}시간 `;
                             txt+=`${rm}분`;
                             document.getElementById(`comp-rem-${safe}`).innerText = txt;
                        } else {
                             document.getElementById(`comp-rem-${safe}`).innerText = '-';
                        }

                    } else { 
                        elGap40.innerText = `${fmtH(Math.abs(gap40))} 부족`; 
                        elGap40.className = "text-xs text-red-500"; 
                        document.getElementById(`comp-box-${safe}`).classList.add('hidden');
                    }

                    updateBar(`bar-52-${safe}`, `pct-52-${safe}`, t.h40, 52, true);
                    document.getElementById(`val-52-${safe}`).innerText = `${fmtH(t.h40)} / 52h`;
                     const elStat52 = document.getElementById(`status-52-${safe}`);
                    if(t.h40 > 52) { elStat52.innerText = "🚨 법정 초과"; elStat52.className = "text-xs text-red-600 font-bold"; }
                    else if(t.h40 > 45) { elStat52.innerText = "⚠️ 주의"; elStat52.className = "text-xs text-orange-500 font-bold"; }
                    else { elStat52.innerText = "안전"; elStat52.className = "text-xs text-slate-400"; }

                    const predBox = document.getElementById(`predict-box-${safe}`);
                    if (t.workingToday && (t.predict40 || t.predict45)) {
                        predBox.classList.remove('hidden');
                        updatePredictText(`time-40-${safe}`, t.predict40);
                        updatePredictText(`time-45-${safe}`, t.predict45);
                    } else {
                        predBox.classList.add('hidden');
                    }
                });
            }

            function parseSmartTime(timeStr, dateStr) {
                if (!timeStr || timeStr.trim() === '-' || timeStr.trim() === '') return null;
                const d = new Date(timeStr);
                if (!isNaN(d.getTime())) return d;
                const match = timeStr.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
                if (match) {
                    const h = parseInt(match[1]);
                    const m = parseInt(match[2]);
                    const s = match[3] ? parseInt(match[3]) : 0;
                    const targetDate = dateStr ? new Date(dateStr) : new Date();
                    targetDate.setHours(h, m, s, 0);
                    return targetDate;
                }
                return null;
            }

            function timeToHours(s) {
                if(!s || s.trim() === '-' || s.trim() === '') return 0;
                const parts = s.split(':');
                if (parts.length < 2) return 0; 
                const h = parseInt(parts[0], 10);
                const m = parseInt(parts[1], 10);
                if (isNaN(h)) return 0;
                return h + (m||0)/60;
            }

            function updateBar(barId, pctId, val, max, warning=false) {
                const pct = Math.min(100, (val/max)*100);
                const bar = document.getElementById(barId);
                bar.style.width = `${pct}%`;
                document.getElementById(pctId).innerText = `${pct.toFixed(0)}%`;
                
                if (warning) {
                    if (val > 52) bar.className = "bg-red-500 h-2 rounded-full transition-all";
                    else if (val > 45) bar.className = "bg-orange-400 h-2 rounded-full transition-all";
                    else bar.className = "bg-slate-300 h-2 rounded-full transition-all";
                } else {
                    if (val >= max) bar.className = "bg-green-500 h-3 rounded-full transition-all";
                    else bar.className = "bg-indigo-500 h-3 rounded-full transition-all";
                }
            }

            function updatePredictText(elId, dateObj) {
                const el = document.getElementById(elId);
                if (!dateObj) { el.innerText = "달성 완료"; el.className = "text-xl font-bold text-green-600"; return; }
                const now = new Date();
                const hh = String(dateObj.getHours()).padStart(2,'0');
                const mm = String(dateObj.getMinutes()).padStart(2,'0');
                if (dateObj < now) {
                    el.innerText = `${hh}:${mm} (지남)`;
                    el.className = "text-xl font-bold text-red-500 animate-pulse";
                } else {
                    el.innerText = `${hh}:${mm}`;
                    el.className = "text-xl font-bold text-indigo-600";
                }
            }

            // --- ★ 40시간(식사제외) 전용 예측 함수: 점심시간 겹치면 1시간 미룸 ---
            function calcExitTimeWithLunch(now, hoursNeeded, clockIn) {
                if (hoursNeeded <= 0) return null; 
                let simul = new Date(now.getTime());
                let remainMs = hoursNeeded * 3600000;
                
                const lunchStart = new Date(clockIn); lunchStart.setHours(11,30,0,0);
                const lunchEnd = new Date(clockIn); lunchEnd.setHours(12,30,0,0);

                if (simul < lunchStart) {
                    // 점심 전: 남은 시간이 점심 시작까지의 시간보다 길면, 점심시간(1h) 추가
                    if (remainMs > (lunchStart - simul)) return new Date(simul.getTime() + remainMs + 3600000); 
                    else return new Date(simul.getTime() + remainMs);
                } else if (simul >= lunchStart && simul < lunchEnd) {
                    // 점심 중: 12:30부터 근무 재개
                    return new Date(lunchEnd.getTime() + remainMs);
                } else {
                    // 점심 후: 그냥 더함
                    return new Date(simul.getTime() + remainMs);
                }
            }

            function calcDuration(inDate, outDate) {
                let durMs = outDate - inDate;
                if (durMs < 0) return { h40:0, h45:0 };
                const h45 = durMs / 3600000; // 45시간용은 식사포함(단순 체류시간)

                const lStart = new Date(inDate); lStart.setHours(11,30,0,0);
                const lEnd = new Date(inDate); lEnd.setHours(12,30,0,0);
                
                const overlapStart = new Date(Math.max(inDate, lStart));
                const overlapEnd = new Date(Math.min(outDate, lEnd));
                let lunchDed = 0;
                if (overlapEnd > overlapStart) lunchDed = overlapEnd - overlapStart;
                
                const h40 = (durMs - lunchDed) / 3600000; // 40시간용은 식사제외
                return { h40, h45 };
            }

            function calcLiveDuration(inDate) {
                return calcDuration(inDate, new Date());
            }

            function calcRemainingDays(datesSet) {
                if (datesSet.size === 0) return 0;
                const sorted = Array.from(datesSet).sort();
                const last = new Date(sorted[sorted.length-1]);
                if (last.getDay() === 0 || last.getDay() >= 5) return 0;

                let count = 0;
                let next = new Date(last);
                next.setDate(next.getDate() + 1);

                while (next.getDay() >= 1 && next.getDay() <= 5) {
                    const y = next.getFullYear();
                    const m = String(next.getMonth()+1).padStart(2,'0');
                    const d = String(next.getDate()).padStart(2,'0');
                    const s = `${y}-${m}-${d}`;
                    if (!HOLIDAYS.has(s)) count++;
                    next.setDate(next.getDate() + 1);
                }
                return count;
            }

            function fmtH(n) {
                if (isNaN(n)) return "0시간 0분";
                const h = Math.floor(n);
                const m = Math.round((n-h)*60);
                return `${h}시간 ${m}분`;
            }

            function parseCSV(txt) {
                const lines = txt.split(/\r?\n/).filter(l=>l.trim());
                if(lines.length<2) return [];
                const headers = lines[0].split(',').map(h=>h.trim());
                return lines.slice(1).map(l=>{
                    const v = l.split(','); const o={};
                    headers.forEach((h,i)=>o[h]=(v[i]||'').trim());
                    return o;
                });
            }

            window.adjDays = (name, v) => {
                if(!remainingDaysAdjustments[name]) remainingDaysAdjustments[name]=0;
                remainingDaysAdjustments[name]+=v;
                calculateAllTotals();
            };
        });
    </script>
