<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주간 근무시간 계산기 (API 연동 v9)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .time-input {
            width: 100%; min-width: 130px; padding: 4px 8px;
            border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;
        }
        .time-input:focus { border-color: #4f46e5; outline: none; box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2); }
        .leave-hours-input {
            width: 60px; padding: 4px 8px;
            border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; text-align: center;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="p-6 md:p-8">
            <h1 class="text-3xl font-bold text-indigo-700 mb-2">주간 근무시간 계산기</h1>
            <p class="text-slate-600">CSV를 업로드하면 <span class="text-indigo-600 font-bold">한국천문연구원 API</span>를 통해 해당 월의 공휴일 정보를 받아옵니다.</p>

            <div class="mt-6 mb-8 p-6 bg-indigo-50 rounded-lg border border-indigo-100">
                <label for="csvUploader" class="block text-sm font-bold text-indigo-800 mb-2">📂 근태 CSV 파일 선택</label>
                <input type="file" id="csvUploader" accept=".csv" class="block w-full text-sm text-slate-500
                    file:mr-4 file:py-2.5 file:px-4
                    file:rounded-md file:border-0
                    file:text-sm file:font-semibold
                    file:bg-white file:text-indigo-700
                    file:shadow-sm
                    hover:file:bg-indigo-50 cursor-pointer
                ">
            </div>

            <div id="loading-spinner" class="hidden text-center py-8">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
                <p class="mt-2 text-indigo-600 font-medium" id="loading-text">공휴일 정보를 불러오는 중입니다...</p>
            </div>

            <div id="results-container" class="space-y-8">
                <div id="placeholder" class="text-center text-slate-400 py-16 border-2 border-dashed border-slate-300 rounded-lg">
                    <p class="text-lg">파일을 업로드하면 결과가 여기에 표시됩니다.</p>
                </div>
            </div>

            <div id="summary-container" class="mt-8 grid grid-cols-1 gap-6"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 제공해주신 인증키
            const API_KEY = "b060c24914cc86079258cce70c2f5ed20157eea835b61224c687501034d7a6b6";
            
            // 공휴일 정보를 저장할 Set (YYYY-MM-DD 형식)
            let HOLIDAYS = new Set();
            // 이미 불러온 월을 기록하여 중복 호출 방지 (Set<"YYYYMM">)
            let FETCHED_MONTHS = new Set();

            const csvUploader = document.getElementById('csvUploader');
            const resultsContainer = document.getElementById('results-container');
            const summaryContainer = document.getElementById('summary-container');
            const placeholder = document.getElementById('placeholder');
            const spinner = document.getElementById('loading-spinner');
            const loadingText = document.getElementById('loading-text');

            let allCsvData = {}; 
            let liveUpdateInterval = null;
            let remainingDaysAdjustments = {};

            csvUploader.addEventListener('change', handleFileUpload);

            async function handleFileUpload(event) {
                if (liveUpdateInterval) clearInterval(liveUpdateInterval);
                const file = event.target.files[0];
                if (!file) return;

                // UI 초기화
                placeholder.style.display = 'none';
                resultsContainer.innerHTML = '';
                summaryContainer.innerHTML = '';
                spinner.classList.remove('hidden');
                remainingDaysAdjustments = {};
                
                // 1. CSV 파싱
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const csvText = e.target.result;
                        const data = parseCSV(csvText);
                        if (!data.length) throw new Error("데이터가 없습니다.");
                        
                        // 2. 필요한 연/월 추출 및 API 호출
                        await prepareHolidaysForData(data);
                        
                        // 3. 데이터 처리 및 렌더링
                        processCsvData(data);
                        spinner.classList.add('hidden');

                    } catch (err) {
                        spinner.classList.add('hidden');
                        alert("처리 중 오류 발생: " + err.message);
                        placeholder.style.display = 'block';
                    }
                };
                reader.readAsText(file, "UTF-8"); 
            }

            /**
             * CSV 데이터에 있는 날짜들과 '현재 날짜'를 기준으로 필요한 공휴일 데이터를 API에서 가져옴
             */
            async function prepareHolidaysForData(data) {
                const monthsToFetch = new Set();
                const now = new Date();
                
                // (1) 현재 연/월 추가 (미래 예측용)
                const currentY = now.getFullYear();
                const currentM = now.getMonth() + 1;
                monthsToFetch.add(`${currentY}${String(currentM).padStart(2, '0')}`);

                // (2) CSV 데이터 내의 연/월 추출
                data.forEach(row => {
                    if (row.근무일자) { // YYYY-MM-DD 가정
                        const parts = row.근무일자.split('-');
                        if (parts.length >= 2) {
                            const y = parts[0];
                            const m = parts[1];
                            monthsToFetch.add(`${y}${m}`);
                        }
                    }
                });

                // (3) API 호출 (병렬 처리)
                const promises = [];
                for (const ym of monthsToFetch) {
                    if (!FETCHED_MONTHS.has(ym)) {
                        const year = ym.substring(0, 4);
                        const month = ym.substring(4, 6);
                        promises.push(fetchHolidaysFromApi(year, month));
                        FETCHED_MONTHS.add(ym);
                    }
                }

                if (promises.length > 0) {
                    loadingText.textContent = `${promises.length}개월 치 공휴일 정보를 API에서 가져오는 중...`;
                    await Promise.all(promises);
                }
            }

            /**
             * 한국천문연구원 특일 정보 API 호출
             */
            async function fetchHolidaysFromApi(year, month) {
                // API 엔드포인트
                const baseUrl = "https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo";
                
                // URL 생성 (ServiceKey는 인코딩 없이 그대로 넣거나, 필요시 인코딩)
                // 주의: 제공된 키가 Hex String이므로 그대로 파라미터에 사용해봅니다.
                // 만약 작동하지 않으면 encodeURIComponent(API_KEY)를 시도해야 합니다.
                const queryParams = `?solYear=${year}&solMonth=${month}&ServiceKey=${API_KEY}&_type=json&numOfRows=50`;
                const url = `${baseUrl}${queryParams}`;

                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`API Error ${response.status}`);
                    
                    const json = await response.json();
                    
                    // 응답 구조 파싱 (response.body.items.item)
                    const items = json.response?.body?.items?.item;

                    if (items) {
                        const list = Array.isArray(items) ? items : [items];
                        list.forEach(item => {
                            if (item.isHoliday === 'Y') {
                                // locdate는 숫자나 문자열 (예: 20250101)
                                const dStr = String(item.locdate);
                                const fmtDate = `${dStr.substring(0,4)}-${dStr.substring(4,6)}-${dStr.substring(6,8)}`;
                                HOLIDAYS.add(fmtDate);
                                console.log(`공휴일 추가됨: ${fmtDate} (${item.dateName})`);
                            }
                        });
                    }
                } catch (error) {
                    console.error(`API Fetch Failed for ${year}-${month}:`, error);
                    // 실패해도 조용히 넘어감 (CORS 등 문제 시)
                    // 필요 시 사용자에게 알림을 줄 수 있음
                }
            }

            function processCsvData(data) {
                allCsvData = {};
                data.forEach(row => {
                    if (!row.이름) return;
                    if (!allCsvData[row.이름]) allCsvData[row.이름] = [];
                    allCsvData[row.이름].push(row);
                });

                if (Object.keys(allCsvData).length === 0) {
                    alert("유효한 데이터가 없습니다."); return;
                }
                renderDataTables();
                calculateAllTotals();
            }

            function renderDataTables() {
                resultsContainer.innerHTML = '';
                Object.keys(allCsvData).sort().forEach(name => {
                    const rows = allCsvData[name];
                    const div = document.createElement('div');
                    div.className = 'bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden';
                    
                    let trs = rows.map((row, idx) => `
                        <tr class="hover:bg-slate-50 transition-colors" data-name="${name}">
                            <td class="p-3 border-b text-sm text-slate-600">${row.근무일자 || '-'}</td>
                            <td class="p-3 border-b"><input type="text" class="time-input clock-in" value="${row.출근시간 || ''}" placeholder="00:00:00"></td>
                            <td class="p-3 border-b"><input type="text" class="time-input clock-out" value="${row.퇴근시간 || ''}" placeholder="00:00:00"></td>
                            <td class="p-3 border-b"><input type="text" class="leave-hours-input leave-hours" value="${row.외출시간 || ''}" placeholder="H:MM"></td>
                            <td class="p-3 border-b">
                                <select class="leave-selector text-sm border-gray-300 rounded p-1">
                                    <option value="normal">정상 근무</option>
                                    <option value="annual">연차 (8h)</option>
                                    <option value="half">반차 (4h)</option>
                                    <option value="quarter">반반차 (2h)</option>
                                </select>
                            </td>
                        </tr>
                    `).join('');

                    div.innerHTML = `
                        <div class="bg-slate-50 p-4 border-b border-slate-200">
                            <h2 class="text-lg font-bold text-slate-800">👤 ${name}</h2>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-slate-100 text-slate-500 text-xs uppercase">
                                    <tr>
                                        <th class="p-3 font-medium">날짜</th>
                                        <th class="p-3 font-medium">출근</th>
                                        <th class="p-3 font-medium">퇴근</th>
                                        <th class="p-3 font-medium">외출</th>
                                        <th class="p-3 font-medium">비고</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white">${trs}</tbody>
                            </table>
                        </div>
                    `;
                    resultsContainer.appendChild(div);
                });
                resultsContainer.querySelectorAll('input, select').forEach(el => el.addEventListener('change', calculateAllTotals));
            }

            function calculateAllTotals() {
                const isInit = (summaryContainer.innerHTML.trim() === '');
                const totals = {};
                let liveNeeded = false;

                document.querySelectorAll('tr[data-name]').forEach(tr => {
                    const name = tr.dataset.name;
                    if (!totals[name]) totals[name] = { h40: 0, h45: 0, dates: new Set(), live: false };

                    const dateTxt = tr.children[0].innerText; // YYYY-MM-DD
                    const dateMatch = dateTxt.match(/\d{4}-\d{2}-\d{2}/);
                    if (dateMatch) totals[name].dates.add(dateMatch[0]);

                    const inTime = tr.querySelector('.clock-in').value;
                    const outTime = tr.querySelector('.clock-out').value;
                    const leaveH = timeToHours(tr.querySelector('.leave-hours').value);
                    const type = tr.querySelector('.leave-selector').value;

                    let dH40 = 0, dH45 = 0;
                    if (inTime && inTime !== '-') {
                        if (outTime && outTime !== '-') {
                            const calcs = calcStatic(inTime, outTime);
                            dH40 = calcs.h40; dH45 = calcs.h45;
                        } else {
                            const calcs = calcLive(inTime);
                            dH40 = calcs.h40; dH45 = calcs.h45;
                            totals[name].live = true; liveNeeded = true;
                        }
                    }
                    dH40 = Math.max(0, dH40 - leaveH);
                    dH45 = Math.max(0, dH45 - leaveH);

                    if (type === 'annual') { dH40 += 8; dH45 += 9; }
                    else if (type === 'half') { dH40 += 4; dH45 += 5; }
                    else if (type === 'quarter') { dH40 += 2; dH45 += 3; }

                    totals[name].h40 += dH40;
                    totals[name].h45 += dH45;
                });

                Object.keys(totals).forEach(name => {
                    const autoDays = calcRemainingDays(totals[name].dates);
                    const adj = remainingDaysAdjustments[name] || 0;
                    totals[name].remDays = Math.max(0, autoDays + adj);
                });

                if (liveNeeded && !liveUpdateInterval) liveUpdateInterval = setInterval(calculateAllTotals, 10000);
                else if (!liveNeeded && liveUpdateInterval) { clearInterval(liveUpdateInterval); liveUpdateInterval = null; }

                if (isInit) createSummaryCards(totals);
                else updateSummaryCards(totals);
            }

            function createSummaryCards(totals) {
                summaryContainer.innerHTML = '';
                Object.keys(totals).sort().forEach(name => {
                    const safe = name.replace(/\s+/g, '-');
                    const div = document.createElement('div');
                    div.className = 'bg-white p-6 rounded-lg shadow-md border border-indigo-100';
                    div.innerHTML = `
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-2xl font-bold text-indigo-900">${name}</h3>
                            <div class="flex items-center bg-slate-100 rounded-lg px-3 py-1.5 space-x-3">
                                <span class="text-sm text-slate-600 font-medium">잔여 근무일(API반영):</span>
                                <div class="flex items-center space-x-1">
                                    <button class="w-6 h-6 flex items-center justify-center bg-white border border-slate-300 rounded text-slate-500 hover:bg-slate-50 hover:text-indigo-600 font-bold" onclick="adjDays('${name}', -1)">-</button>
                                    <span id="rem-txt-${safe}" class="w-6 text-center font-bold text-indigo-600 text-lg">0</span>
                                    <button class="w-6 h-6 flex items-center justify-center bg-white border border-slate-300 rounded text-slate-500 hover:bg-slate-50 hover:text-indigo-600 font-bold" onclick="adjDays('${name}', 1)">+</button>
                                </div>
                            </div>
                        </div>
                        <div class="mb-6">
                            <div class="flex justify-between mb-1">
                                <span class="text-sm font-semibold text-slate-600">주 40시간 목표</span>
                                <span id="pct-40-${safe}" class="text-sm font-bold text-indigo-600">0%</span>
                            </div>
                            <div class="w-full bg-slate-200 rounded-full h-4 overflow-hidden shadow-inner">
                                <div id="bar-40-${safe}" class="bg-indigo-500 h-4 rounded-full transition-all duration-700 ease-out" style="width: 0%"></div>
                            </div>
                            <p id="msg-40-${safe}" class="text-xs text-right mt-1 text-slate-400 font-medium">-</p>
                        </div>
                        <div class="mb-6">
                            <div class="flex justify-between mb-1">
                                <span class="text-sm font-semibold text-slate-600">주 52시간 한도</span>
                                <span id="pct-52-${safe}" class="text-sm font-bold text-slate-500">0%</span>
                            </div>
                            <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden shadow-inner">
                                <div id="bar-52-${safe}" class="bg-slate-400 h-2.5 rounded-full transition-all duration-700 ease-out" style="width: 0%"></div>
                            </div>
                            <p id="msg-52-${safe}" class="text-xs text-right mt-1 text-slate-400 font-medium">-</p>
                        </div>
                        <div class="bg-indigo-50 rounded-lg p-4 border border-indigo-100 grid grid-cols-2 gap-4 text-center">
                            <div>
                                <p class="text-xs text-slate-500 mb-1">현재 누적 시간</p>
                                <p id="cur-40-${safe}" class="text-xl font-bold text-slate-800">-</p>
                            </div>
                            <div>
                                <p class="text-xs text-slate-500 mb-1">주간 예상 최종</p>
                                <p id="pred-40-${safe}" class="text-xl font-bold text-indigo-600">-</p>
                                <p class="text-[10px] text-slate-400 mt-1">*남은 평일 8H 근무 시</p>
                            </div>
                        </div>
                    `;
                    summaryContainer.appendChild(div);
                });
                updateSummaryCards(totals);
            }

            function updateSummaryCards(totals) {
                Object.keys(totals).forEach(name => {
                    const t = totals[name];
                    const safe = name.replace(/\s+/g, '-');
                    document.getElementById(`rem-txt-${safe}`).innerText = t.remDays;

                    // 40h
                    const pct40 = Math.min(100, (t.h40 / 40) * 100);
                    const bar40 = document.getElementById(`bar-40-${safe}`);
                    bar40.style.width = `${pct40}%`;
                    document.getElementById(`pct-40-${safe}`).innerText = `${pct40.toFixed(1)}%`;
                    
                    const msg40 = document.getElementById(`msg-40-${safe}`);
                    if (t.h40 >= 40) {
                        bar40.className = "bg-green-500 h-4 rounded-full transition-all duration-700";
                        msg40.innerText = `🎉 목표 달성! (+${fmtH(t.h40 - 40)})`;
                        msg40.className = "text-xs text-right mt-1 text-green-600 font-bold";
                    } else {
                        bar40.className = "bg-indigo-500 h-4 rounded-full transition-all duration-700";
                        msg40.innerText = `${fmtH(40 - t.h40)} 남음`;
                        msg40.className = "text-xs text-right mt-1 text-indigo-500 font-medium";
                    }

                    // 52h
                    const pct52 = Math.min(100, (t.h40 / 52) * 100);
                    const bar52 = document.getElementById(`bar-52-${safe}`);
                    bar52.style.width = `${pct52}%`;
                    document.getElementById(`pct-52-${safe}`).innerText = `${fmtH(t.h40)} / 52h`;
                    
                    const msg52 = document.getElementById(`msg-52-${safe}`);
                    if (t.h40 > 52) {
                        bar52.className = "bg-red-500 h-2.5 rounded-full transition-all duration-700";
                        msg52.innerText = "🚨 법정 근로시간 초과";
                        msg52.className = "text-xs text-right mt-1 text-red-600 font-bold";
                    } else if (t.h40 > 45) {
                        bar52.className = "bg-orange-400 h-2.5 rounded-full transition-all duration-700";
                        msg52.innerText = "⚠️ 한도 임박";
                        msg52.className = "text-xs text-right mt-1 text-orange-500 font-bold";
                    } else {
                        bar52.className = "bg-slate-300 h-2.5 rounded-full transition-all duration-700";
                        msg52.innerText = "안전 범위";
                        msg52.className = "text-xs text-right mt-1 text-slate-400";
                    }

                    document.getElementById(`cur-40-${safe}`).innerText = fmtH(t.h40);
                    const predH = t.h40 + (t.remDays * 8);
                    const predEl = document.getElementById(`pred-40-${safe}`);
                    predEl.innerText = fmtH(predH);
                    if (predH >= 40) predEl.className = "text-xl font-bold text-green-600";
                    else predEl.className = "text-xl font-bold text-red-500";
                });
            }

            function calcRemainingDays(datesSet) {
                if (datesSet.size === 0) return 0;
                const sorted = Array.from(datesSet).sort();
                const last = new Date(sorted[sorted.length - 1]);
                // 마지막 기록일이 금~일이면 그 주는 남은 날 없음
                if (last.getDay() === 0 || last.getDay() >= 5) return 0;

                let count = 0;
                let next = new Date(last);
                next.setDate(next.getDate() + 1);

                // 이번주 금요일까지만 순회
                while (next.getDay() >= 1 && next.getDay() <= 5) {
                    const y = next.getFullYear();
                    const m = String(next.getMonth()+1).padStart(2,'0');
                    const d = String(next.getDate()).padStart(2,'0');
                    const key = `${y}-${m}-${d}`;
                    
                    // API로 받아온 공휴일 리스트에 없으면 근무일로 인정
                    if (!HOLIDAYS.has(key)) count++;
                    next.setDate(next.getDate() + 1);
                }
                return count;
            }

            function calcStatic(inStr, outStr) {
                const i = parseTime(inStr), o = parseTime(outStr);
                if (!i || !o || o < i) return { h40:0, h45:0 };
                const dur = (o - i) / 3600000;
                const lS = setTime(i, "11:30:00"), lE = setTime(i, "12:30:00");
                const over = Math.max(0, Math.min(o, lE) - Math.max(i, lS));
                return { h40: dur - (over/3600000), h45: dur };
            }
            function calcLive(inStr) {
                const i = parseTime(inStr), now = new Date();
                if (!i) return { h40:0, h45:0 };
                const dur = Math.max(0, now - i) / 3600000;
                const lS = setTime(i, "11:30:00"), lE = setTime(i, "12:30:00");
                const over = Math.max(0, Math.min(now, lE) - Math.max(i, lS));
                return { h40: dur - (over/3600000), h45: dur };
            }
            function parseTime(s) {
                if (!s) return null;
                if (s.includes('-')) return new Date(s.replace(' ', 'T'));
                const d = new Date(); const [h,m,sec] = s.split(':');
                d.setHours(h, m, sec||0, 0); return d;
            }
            function setTime(d, tStr) { const n = new Date(d); const [h,m,s] = tStr.split(':'); n.setHours(h, m, s, 0); return n; }
            function timeToHours(s) { if (!s || !s.includes(':')) return 0; const [h, m] = s.split(':').map(Number); return h + m/60; }
            function fmtH(dec) { const val = Math.max(0, dec); const h = Math.floor(val); const m = Math.round((val - h) * 60); return `${h}시간 ${m}분`; }
            function parseCSV(txt) {
                const lines = txt.split(/\r?\n/).filter(l => l.trim());
                if (lines.length < 2) return [];
                const headers = lines[0].split(',').map(h => h.trim());
                return lines.slice(1).map(l => {
                    const v = l.split(','); const o = {};
                    headers.forEach((h, i) => o[h] = (v[i]||'').trim()); return o;
                });
            }
            
            window.adjDays = (name, val) => {
                if (!remainingDaysAdjustments[name]) remainingDaysAdjustments[name] = 0;
                remainingDaysAdjustments[name] += val; calculateAllTotals();
            };
        });
    </script>
