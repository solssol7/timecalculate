<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주간 근무 관리</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h2>📅 주간 근무 현황</h2>
            <p class="subtitle">이번 주 근무 시간을 관리하세요.</p>
        </header>

        <div class="input-section">
            <label for="workInput">현재 누적 근무 시간:</label>
            <input type="number" id="workInput" value="0" step="0.5" min="0"> 시간
        </div>

        <div class="status-card">
            <div class="time-info">
                <span class="label">누적 근무</span>
                <span class="value"><strong id="currentHours">0</strong> / 40h</span>
            </div>

            <div class="progress-track">
                <div id="progressBar" class="progress-fill"></div>
            </div>

            <div class="remain-info">
                상태: <span id="statusText" class="status-normal">정상 근무 중</span>
                <span class="divider">|</span>
                잔여: <strong id="remainHours">40</strong>시간
            </div>
        </div>

        <div id="overtimeSection" class="overtime-card hidden">
            <div class="card-header">
                <span class="icon">🎁</span> 
                <strong>주 40시간 초과 달성!</strong>
            </div>
            <p class="desc">
                초과 근무 <strong id="overtimeHours">0</strong>시간이 발생했습니다.<br>
                아래 보상 휴가로 전환할 수 있습니다.
            </p>
            
            <div class="badge-container">
                <div class="reward-badge" id="badgeQuarter">
                    <span class="badge-tag">0.25</span> 반반차
                </div>
                <div class="reward-badge" id="badgeHalf">
                    <span class="badge-tag">0.5</span> 반차
                </div>
                <div class="reward-badge" id="badgeDay">
                    <span class="badge-tag">1.0</span> 연차(1일)
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
